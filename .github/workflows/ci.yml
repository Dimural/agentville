name: ci
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  ci:
    runs-on: macos-15
    timeout-minutes: 30
    env:
      CI: "true"
    steps:
      - uses: actions/checkout@v4
      - name: Show toolchain
        run: swift --version
      - name: Guards, tests, footprint (scripts/ci.sh)
        run: scripts/ci.sh
